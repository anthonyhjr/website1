<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | HartWebDev - Portfolio</title>
    <meta name="description" content="Explore all web development services I offer including website development, redesign, e-commerce solutions, landing pages, and digital products.">
    <meta name="keywords" content="web development services, website design, e-commerce development, landing page design, digital products, web services">
    <meta name="author" content="Anthony Hartwell Jr">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://yourwebsite.com/services.html">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Animation -->
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">
            <span class="loader-dots">Loading</span>
        </div>
    </div>

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <a href="index.html" class="logo">HartWebDev</a>
                <ul class="nav-menu" id="navMenu">
                    <!-- Navigation links will be rendered by nav-links.js -->
                </ul>
                <div class="nav-right">
                    <span class="availability-badge" id="availabilityBadge">
                        <i class="fas fa-circle"></i> Available for Hire
                    </span>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle mobile menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Services Section -->
    <section class="section services-section" style="padding-top: 120px;">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Services</h2>
                <div class="title-underline"></div>
                <p class="section-subtitle">Explore all services I offer for websites, digital products, and automation.</p>
            </div>
            <div class="services-grid" id="all-services-grid"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; <span id="currentYear"></span> HartWebDev. All rights reserved.</p>
                <div class="footer-links">
                    <!-- Navigation links will be rendered by nav-links.js -->
                </div>
            </div>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Skip to Content Link (Accessibility) -->
    <a href="#services" class="skip-to-content">Skip to content</a>

    <!-- Custom Cursor -->
    <div class="custom-cursor" id="customCursor">
        <div class="cursor-dot"></div>
        <div class="cursor-outline"></div>
    </div>

    <!-- Scripts -->
    <script src="nav-links.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="services-data.js"></script>
    <script src="services-renderer.js"></script>
    <script src="script.js"></script>
    <script>
        // Render all services on services page
        document.addEventListener('DOMContentLoaded', function() {
            renderServices('all-services-grid', false);
        });
    </script>
</body>
</html>
