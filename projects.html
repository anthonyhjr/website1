<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | HartWebDev - Web Development Portfolio | Atlanta, GA</title>

    <meta name="keywords" content="web development projects, portfolio projects, website examples, e-commerce websites, interactive games, web applications, React projects, JavaScript projects, Atlanta web developer">
    <meta name="author" content="Anthony Hartwell Jr - HartWebDev">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="https://yourwebsite.com/projects.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com/projects.html">
    <meta property="og:title" content="Projects | HartWebDev - Web Development Portfolio">
    <meta property="og:description" content="Browse portfolio of web development projects including websites, e-commerce solutions, and interactive games.">
    <meta property="og:image" content="https://yourwebsite.com/preview-image.jpg">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:image" content="https://yourwebsite.com/preview-image.jpg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Animation -->
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">
            <span class="loader-dots">Loading</span>
        </div>
    </div>

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <a href="index.html" class="logo">HartWebDev</a>
                <ul class="nav-menu" id="navMenu">
                    <!-- Navigation links will be rendered by nav-links.js -->
                </ul>
                <div class="nav-right">
                    <span class="availability-badge" id="availabilityBadge">
                        <i class="fas fa-circle"></i> Available for Hire
                    </span>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle mobile menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Projects Section -->
    <section class="section projects-section" style="padding-top: 120px;" id="projects">
        <div class="container">
            <div class="section-header">
                <h1 class="section-title">My Projects</h1>
                <div class="title-underline"></div>
                <p class="section-subtitle">Explore my portfolio of websites and interactive games</p>
            </div>
            
            <!-- Project Filters -->
            <div class="project-filters" role="tablist" aria-label="Filter projects by category">
                <button class="project-filter-btn active" data-category="all" role="tab" aria-selected="true" aria-controls="projects-grid">
                    <span>All Projects</span>
                </button>
                <button class="project-filter-btn" data-category="website" role="tab" aria-selected="false" aria-controls="projects-grid">
                    <i class="fas fa-globe"></i>
                    <span>Websites</span>
                </button>
                <button class="project-filter-btn" data-category="game" role="tab" aria-selected="false" aria-controls="projects-grid">
                    <i class="fas fa-gamepad"></i>
                    <span>Games</span>
                </button>
            </div>
            
            <div class="projects-grid modern-projects-grid" id="projects-grid" role="tabpanel">
                <!-- Projects will be rendered by projects-renderer.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; <span id="currentYear"></span> HartWebDev. All rights reserved.</p>
                <div class="footer-links">
                    <!-- Navigation links will be rendered by nav-links.js -->
                </div>
            </div>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Skip to Content Link (Accessibility) -->
    <a href="#projects" class="skip-to-content">Skip to content</a>

    <!-- Custom Cursor -->
    <div class="custom-cursor" id="customCursor">
        <div class="cursor-dot"></div>
        <div class="cursor-outline"></div>
    </div>

    <!-- Structured Data for Projects -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "HartWebDev Projects Portfolio",
        "description": "Portfolio of web development projects including websites, e-commerce solutions, and interactive games",
        "url": "https://yourwebsite.com/projects.html",
        "mainEntity": {
            "@type": "ItemList",
            "itemListElement": [
                {
                    "@type": "ListItem",
                    "position": 1,
                    "item": {
                        "@type": "WebSite",
                        "name": "Ink & Soul",
                        "url": "https://loquacious-heliotrope-4e3d17.netlify.app/",
                        "description": "Modern website for a tattoo studio built with React and Node.js"
                    }
                },
                {
                    "@type": "ListItem",
                    "position": 2,
                    "item": {
                        "@type": "WebSite",
                        "name": "Island Spice & Basil",
                        "url": "https://darling-parfait-6813a7.netlify.app/",
                        "description": "Mobile-friendly restaurant experience with interactive menu and online ordering"
                    }
                },
                {
                    "@type": "ListItem",
                    "position": 3,
                    "item": {
                        "@type": "WebSite",
                        "name": "E-Commerce Website",
                        "url": "https://jazzy-rabanadas-0dcd58.netlify.app/",
                        "description": "E-commerce experience with cart management and payment integrations"
                    }
                }
            ]
        }
    }
    </script>

    <!-- Scripts -->
    <script src="nav-links.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="projects-data.js"></script>
    <script src="projects-renderer.js"></script>
    <script src="script.js"></script>
</body>
</html>
